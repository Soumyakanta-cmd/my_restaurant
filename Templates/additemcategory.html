{% extends "dashboard.html" %}

{% block page_title %}Add Category{% endblock %}

{% block content %}

<div class="confirm-wrap">
  <div class="panel confirm-panel">
    <div class="panel-header">
      <div class="panel-title">Add New Category</div>
      <a href="{% url 'itemcategory' %}" class="panel-action">← Back</a>
    </div>
    <div class="confirm-body">
      <form method="post" class="admin-form">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="form-error">{{ field.errors|join:", " }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <div class="confirm-actions" style="margin-top:24px;">
          <button type="submit" class="add-btn">Save Category</button>
          <a href="{% url 'itemcategory' %}" class="delete-btn">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}

{% extends "dashboard.html" %}

{% block page_title %}Add Offer{% endblock %}

{% block content %}

<div class="confirm-wrap">
  <div class="panel confirm-panel">
    <div class="panel-header">
      <div class="panel-title">Add New Offer</div>
      <a href="{% url 'offerus' %}" class="panel-action">← Back</a>
    </div>
    <div class="confirm-body">
      <form method="POST" enctype="multipart/form-data" class="admin-form">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label">Item</label>
          <select name="item">
            <option value="" disabled selected>— Select Item —</option>
            {% for i in items %}
            <option value="{{ i.id }}">{{ i.Item_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Discount (%)</label>
          <input type="number" name="discount" min="0" max="100" placeholder="e.g. 20">
        </div>

        <div class="form-group">
          <label class="form-label">Image</label>
          <input type="file" name="image" accept="image/*">
        </div>

        <div class="confirm-actions" style="margin-top:24px;">
          <button type="submit" class="add-btn">Save Offer</button>
          <a href="{% url 'offerus' %}" class="delete-btn">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}

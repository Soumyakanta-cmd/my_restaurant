{% extends "dashboard.html" %}
{% load static %}

{% block page_title %}Edit Profile{% endblock %}

{% block content %}

<div class="confirm-wrap">
  <div class="panel confirm-panel">
    <div class="panel-header">
      <div class="panel-title">Edit Profile</div>
      <a href="{% url 'admin-profile' %}" class="panel-action">← Back</a>
    </div>
    <div class="confirm-body">
      <form method="post" enctype="multipart/form-data" class="admin-form">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" value="{{ request.user.username }}">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" value="{{ request.user.email }}">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Leave blank to keep current">
            <button type="button" class="pw-toggle" onclick="togglePassword()">
              <img src="{% static 'images/view.png' %}" width="16" height="16">
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Profile Image</label>
          <input type="file" name="image" accept="image/*">
        </div>

        <div class="confirm-actions" style="margin-top:24px;">
          <button type="submit" class="add-btn">Save Changes</button>
          <a href="{% url 'admin-profile' %}" class="delete-btn">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
function togglePassword() {
  const f = document.getElementById('password');
  f.type = f.type === 'password' ? 'text' : 'password';
}
</script>

{% endblock %}

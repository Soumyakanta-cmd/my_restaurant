<!DOCTYPE html>
<html>
<head>
  <title>Payment Confirmed</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 16px; padding: 48px 40px;
            text-align: center; max-width: 400px; width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #2e7d32; font-size: 24px; margin: 0 0 8px; }
    p  { color: #666; font-size: 15px; line-height: 1.6; }
    .pill { background: #e8f5e9; color: #2e7d32; font-weight: 700;
            padding: 6px 20px; border-radius: 50px; font-size: 14px;
            display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Payment Successful!</h1>
    <p>Thank you <strong>{{ booking.Name }}</strong>, your bill has been paid successfully.</p>
    <p style="color:#aaa; font-size:13px;">Payment ID: {{ booking.razorpay_payment_id }}</p>
    <div class="pill">Booking #{{ booking.id }} · Paid</div>
  </div>
</body>
</html>
